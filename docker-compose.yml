services:
  aild-web:
    container_name: aild-web
    ports:
      # Localhost only: Docker bypasses UFW, so public traffic goes through Nginx
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    # NEXT_PUBLIC_* are baked in at build time. Compose reads them from `.env` (not .env.production),
    # so create .env from .env.example before `docker compose up --build`.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:?set NEXT_PUBLIC_API_ENDPOINT in .env}
        NEXT_PUBLIC_GOOGLE_LOGIN_URL: ${NEXT_PUBLIC_GOOGLE_LOGIN_URL:?set NEXT_PUBLIC_GOOGLE_LOGIN_URL in .env}
        # Optional: set both to serve admin and student portals on separate domains
        NEXT_PUBLIC_STUDENT_URL: ${NEXT_PUBLIC_STUDENT_URL:-}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
    environment:
      - NODE_ENV=production
    restart: unless-stopped
