version: '3.8'
services:
  aild-web:

    container_name: aild-web
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    # Build image with variables from .env (Local or VPS)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-http://localhost:8080}
        NEXT_PUBLIC_GOOGLE_LOGIN_URL: ${NEXT_PUBLIC_GOOGLE_LOGIN_URL:-http://localhost:8080/api/v1/auth/oauth2/authorization/google}
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_URL=https://productic.com
      # - NEXT_PUBLIC_GOOGLE_LOGIN_URL=http://localhost:8080/api/v1/auth/oauth2/authorization/google
    restart: always
