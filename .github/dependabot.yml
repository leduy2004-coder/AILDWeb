# Dependabot: opens PRs against the default branch (production) when dependencies have updates.
# Security alerts and security-fix PRs are switched on in the repo settings
# (Settings > Code security), not in this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      # One PR a week for every non-breaking update instead of one PR per package
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
