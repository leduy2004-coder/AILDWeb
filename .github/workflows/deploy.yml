name: Frontend CI/CD

on:
  push:
    branches: [production]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.mcp.json'
  workflow_dispatch:

# Never run two deploys on the VPS at the same time
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /opt/aild/aild-web
            # Deploy exactly what is on origin/production (untracked .env files are kept)
            git fetch origin production
            git checkout -B production origin/production
            docker compose up -d --build
            docker image prune -f
            docker compose ps
